<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temperature Converter</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="box">
    <p class="task">TASK 3</p>

    <h1>Temperature <span>Converter</span></h1>

    <p class="intro">
      Convert temperatures between Celsius, Fahrenheit and Kelvin.
    </p>

    <label>Enter Temperature</label>
    <input type="number" id="temp" placeholder="Enter temperature value">

    <p id="error"></p>

    <label>Select Input Unit</label>
    <select id="unit">
      <option value="c">Celsius (°C)</option>
      <option value="f">Fahrenheit (°F)</option>
      <option value="k">Kelvin (K)</option>
    </select>

    <button onclick="convert()">Convert Temperature ↻</button>

    <div class="results">
      <div>
        <p>Celsius</p>
        <strong id="celsius">-- °C</strong>
      </div>

      <div>
        <p>Fahrenheit</p>
        <strong id="fahrenheit">-- °F</strong>
      </div>

      <div>
        <p>Kelvin</p>
        <strong id="kelvin">-- K</strong>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
